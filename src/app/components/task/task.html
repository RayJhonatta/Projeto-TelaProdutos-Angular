<div class="task-container">
    <h1 class="title-task"> 
      <span class="material-icons icons-task-container">task</span>
      Tarefas
    </h1>
    <span class="paragraph-task">Gerencie suas tarefas e acompanhe seu progresso.</span>
    <div class="search-and-filter">
      <div class="search-bar">
        <span class="material-icons icon-search">search</span>
        <input type="text" class="text-search-bar" placeholder="Pesquisar matéria...">
      </div>
      <div class="container-filter">
        <select name="articles" id="articles" class="articles">
          <option value="">Todas as matérias</option>
          <option value="">Teste 01</option>
        </select>
        <select name="status" id="status" class="status">
          <option value="">Todas os status</option>
          <option value="">Teste 01</option>
        </select>
      </div>
      <div class="container-button-cleaning">
        <button class="button-cleaning"><span class="material-icons icon-cleaning">cleaning_services</span>Limpar filtros</button>
      </div>
    </div>    
    <div class="button-add-task">
      <button type="submit" class="button"><span class="material-icons icon-add">add</span> Nova Tarefa</button>
    </div>
</div>
